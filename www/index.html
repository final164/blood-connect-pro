<!doctype html>
<html lang="bn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#c1121f" />
    <title>স্পন্দন · Spandon</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0a0a;
        color: #fff;
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
      }
      .wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.85rem;
      }
      .logo {
        width: 72px;
        height: 72px;
        border-radius: 16px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 8px 28px rgba(193, 18, 31, 0.35);
        animation: spandon-beep 1.1s ease-in-out infinite;
        transform-origin: center;
      }
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .mark {
        font-weight: 800;
        letter-spacing: 0.02em;
        font-size: 1.15rem;
      }
      .sub {
        opacity: 0.8;
        font-size: 0.75rem;
        text-align: center;
      }
      @keyframes spandon-beep {
        0%,
        100% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.09);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.07);
        }
        56% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <!-- Fallback shell if server.url is unreachable; production uses live HTTPS. -->
    <div class="wrap" role="status" aria-busy="true">
      <div class="logo">
        <img src="./spandon-logo.jpg" alt="Spandon" width="72" height="72" />
      </div>
      <div class="mark">স্পন্দন</div>
      <div class="sub">Spandon · Loading…</div>
    </div>
    <script>
      try {
        if (location.protocol === "capacitor:" || location.protocol === "https:") {
          /* Capacitor server.url handles primary load */
        }
      } catch (e) {}
    </script>
  </body>
</html>
